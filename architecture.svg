<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee" />
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa" />
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280" />
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="900" fill="#0A101C" />

  <!-- title -->
  <text x="60" y="50" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#e5e7eb">VaporTrace — Architecture</text>
  <text x="60" y="74" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#6b7280">A real event, traced from the cloud to your terminal</text>

  <!-- AWS zone -->
  <rect x="60" y="100" width="760" height="740" rx="10" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6,6" />
  <text x="84" y="132" font-size="13" fill="#22d3ee" letter-spacing="0.5">Your AWS Account (deployed via CDK)</text>

  <!-- Local zone -->
  <rect x="900" y="100" width="640" height="740" rx="10" fill="none" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6,6" />
  <text x="924" y="132" font-size="13" fill="#a78bfa" letter-spacing="0.5">Your Machine (local)</text>

  <!-- S3 Bucket -->
  <rect x="140" y="170" width="260" height="80" rx="6" fill="#111827" stroke="#22d3ee" stroke-width="1.5" />
  <text x="270" y="205" font-size="16" fill="#e5e7eb" text-anchor="middle">S3 Bucket</text>
  <text x="270" y="228" font-size="12" fill="#6b7280" text-anchor="middle">upload triggers event</text>

  <!-- EventBridge Bus -->
  <rect x="140" y="320" width="260" height="80" rx="6" fill="#111827" stroke="#22d3ee" stroke-width="1.5" />
  <text x="270" y="355" font-size="16" fill="#e5e7eb" text-anchor="middle">EventBridge Bus</text>
  <text x="270" y="378" font-size="12" fill="#6b7280" text-anchor="middle">Archive + Replay enabled</text>

  <!-- Forwarder Lambda -->
  <rect x="140" y="470" width="240" height="80" rx="6" fill="#111827" stroke="#22d3ee" stroke-width="1.5" />
  <text x="260" y="500" font-size="15" fill="#e5e7eb" text-anchor="middle">Forwarder Lambda</text>
  <text x="260" y="522" font-size="12" fill="#6b7280" text-anchor="middle">relays + reports span</text>

  <!-- Processor Lambda -->
  <rect x="420" y="470" width="240" height="80" rx="6" fill="#111827" stroke="#22d3ee" stroke-width="1.5" />
  <text x="540" y="500" font-size="15" fill="#e5e7eb" text-anchor="middle">Processor Lambda</text>
  <text x="540" y="522" font-size="12" fill="#6b7280" text-anchor="middle">business logic + span</text>

  <!-- X-Ray -->
  <rect x="440" y="170" width="240" height="80" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
  <text x="560" y="205" font-size="15" fill="#e5e7eb" text-anchor="middle">AWS X-Ray</text>
  <text x="560" y="228" font-size="12" fill="#6b7280" text-anchor="middle">independent verification</text>

  <!-- IoT Core -->
  <rect x="270" y="630" width="260" height="80" rx="6" fill="#111827" stroke="#22d3ee" stroke-width="1.5" />
  <text x="400" y="665" font-size="16" fill="#e5e7eb" text-anchor="middle">IoT Core</text>
  <text x="400" y="688" font-size="12" fill="#6b7280" text-anchor="middle">MQTT tunnel endpoint</text>

  <!-- CLI -->
  <rect x="980" y="360" width="240" height="80" rx="6" fill="#111827" stroke="#a78bfa" stroke-width="1.5" />
  <text x="1100" y="393" font-size="16" fill="#e5e7eb" text-anchor="middle">VaporTrace CLI</text>
  <text x="1100" y="416" font-size="12" fill="#6b7280" text-anchor="middle">MQTT client + SSE server</text>

  <!-- Dashboard -->
  <rect x="980" y="520" width="240" height="80" rx="6" fill="#111827" stroke="#a78bfa" stroke-width="1.5" />
  <text x="1100" y="553" font-size="16" fill="#e5e7eb" text-anchor="middle">Local Dashboard</text>
  <text x="1100" y="576" font-size="12" fill="#6b7280" text-anchor="middle">Next.js, live trace waterfall</text>

  <!-- arrows: S3 -> EventBridge -->
  <line x1="270" y1="250" x2="270" y2="316" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)" />

  <!-- EventBridge -> Forwarder -->
  <line x1="240" y1="400" x2="240" y2="466" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)" />
  <!-- EventBridge -> Processor -->
  <line x1="330" y1="400" x2="520" y2="466" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)" />

  <!-- Forwarder -> IoT Core -->
  <line x1="290" y1="550" x2="350" y2="626" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)" />
  <!-- Processor -> IoT Core -->
  <line x1="500" y1="550" x2="450" y2="626" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)" />

  <!-- dashed trace annotation lines to X-Ray -->
  <line x1="380" y1="480" x2="470" y2="245" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,4" />
  <line x1="480" y1="470" x2="540" y2="254" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,4" />
  <text x="700" y="130" font-size="11" fill="#f59e0b" text-anchor="end">- - - trace annotation</text>

  <!-- IoT Core -> CLI (crosses the boundary) -->
  <path d="M 530,660 C 750,660 800,400 976,400" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowViolet)" />
  <text x="760" y="580" font-size="12" fill="#a78bfa" text-anchor="middle">MQTT over TLS</text>

  <!-- CLI -> Dashboard -->
  <line x1="1100" y1="440" x2="1100" y2="516" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowViolet)" />
  <text x="1160" y="484" font-size="12" fill="#6b7280">SSE</text>

  <!-- legend -->
  <line x1="900" y1="800" x2="940" y2="800" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray)" />
  <text x="950" y="804" font-size="12" fill="#6b7280">data flow</text>
  <line x1="1060" y1="800" x2="1100" y2="800" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,4" />
  <text x="1110" y="804" font-size="12" fill="#6b7280">trace annotation</text>
</svg>
